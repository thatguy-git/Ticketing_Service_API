version: '3.8'

services:
    postgres:
        image: postgres:15-alpine
        container_name: ticketing_postgres
        restart: always
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
            POSTGRES_DB: ticketing_db
        ports:
            - '5434:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data

    redis:
        image: redis:alpine
        container_name: ticketing_redis
        ports:
            - '6379:6379'

volumes:
    postgres_data:
